name: Android build
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', 'wasm/**', 'src/**', 'words.txt', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/**', 'wasm/**', 'src/**', 'words.txt', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install GHC WebAssembly compiler
        run: |
          curl -fsSL https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | FLAVOUR=9.10 sh
          "$HOME/.ghc-wasm/add_to_github_path.sh"
      - name: Build and bundle web assets
        run: |
          rm -f BananaSolver.cabal banana-web.cabal
          wasm32-wasi-cabal update
          wasm32-wasi-cabal build exe:banana-wasm
          mkdir -p web/public android/app/src/main/assets/www
          cp "$(wasm32-wasi-cabal list-bin exe:banana-wasm)" web/public/solver.wasm
          cp words.txt web/public/words.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and copy Android web assets
        run: |
          npm run build --prefix web -- --base=/assets/www/
          cp -R web/dist/. android/app/src/main/assets/www/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK, lint and unsigned release bundle
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug bundleRelease assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: banana-board-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: banana-board-android-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
