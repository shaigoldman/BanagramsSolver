name: Web app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: docker build -t banana-board .
      - name: Start app
        run: docker run -d --name banana -p 8080:8080 banana-board
      - name: Test API
        run: |
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
          python3 tests/smoke.py
      - name: Show server logs on failure
        if: failure()
        run: docker logs banana || true
